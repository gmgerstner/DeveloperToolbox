name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes a queued one
# instead of leaving two deployments fighting over the github-pages environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:prod

      - name: List build output
        run: |
          echo "Contents of dist/:"
          ls -la dist/
          echo "Contents of dist/developer-toolbox-ui/:"
          ls -la dist/developer-toolbox-ui/
          echo "Checking for index.html:"
          find dist/ -name "index.html" -exec ls -la {} \;
          echo "Checking base href in index.html:"
          cat dist/developer-toolbox-ui/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/developer-toolbox-ui'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5